<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Zakres prac do wykonania i informacje kontaktowe."
    />
    <title>Zakres prac</title>
    <style>
      :root {
        --ink: #171614;
        --paper: #f3f0e9;
        --accent: #ff5a36;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.95), transparent 45%),
          var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      button {
        font: inherit;
      }

      .page-shell {
        display: grid;
        min-height: 100svh;
        padding: 32px;
        place-items: center;
      }

      .content {
        width: min(760px, 100%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 26px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0 auto;
        font-size: clamp(2.4rem, 7vw, 5.8rem);
        font-weight: 600;
        letter-spacing: -0.065em;
        line-height: 0.95;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 48px;
        padding: 15px 22px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--ink);
        color: white;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 0 rgba(23, 22, 20, 0);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .download-button span {
        font-size: 1.25rem;
        line-height: 1;
      }

      .download-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 0 var(--accent);
      }

      .download-button:active {
        transform: translateY(1px);
        box-shadow: 0 4px 0 var(--accent);
      }

      .download-button:focus-visible,
      .close-button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .contact-dialog {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 24px;
        border: 0;
        background: rgba(23, 22, 20, 0.72);
        backdrop-filter: blur(8px);
      }

      .contact-dialog[open] {
        display: grid;
        animation: fade-in 180ms ease-out;
        place-items: center;
      }

      .dialog-card {
        position: relative;
        width: min(560px, 100%);
        padding: clamp(56px, 9vw, 88px) 28px;
        overflow: hidden;
        border-radius: 24px;
        background: var(--accent);
        color: var(--ink);
        text-align: center;
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.35);
        animation: pop-in 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .dialog-card::before,
      .dialog-card::after {
        position: absolute;
        width: 160px;
        aspect-ratio: 1;
        border: 1px solid rgba(23, 22, 20, 0.24);
        border-radius: 50%;
        content: "";
      }

      .dialog-card::before {
        top: -94px;
        left: -58px;
      }

      .dialog-card::after {
        right: -70px;
        bottom: -105px;
      }

      .spark {
        display: block;
        margin-bottom: 18px;
        font-size: 2.2rem;
      }

      .dialog-card h2,
      .dialog-card p {
        margin: 0;
      }

      .dialog-card h2 {
        font-size: clamp(2.35rem, 9vw, 4.8rem);
        letter-spacing: -0.065em;
        line-height: 0.95;
      }

      .dialog-card p {
        margin-top: 10px;
        font-size: clamp(1rem, 3.5vw, 1.4rem);
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      .close-button {
        position: absolute;
        top: 16px;
        right: 16px;
        display: grid;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 1px solid rgba(23, 22, 20, 0.45);
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        font-size: 1.6rem;
        line-height: 1;
        cursor: pointer;
        place-items: center;
        transition: background 150ms ease, color 150ms ease, transform 150ms ease;
      }

      .close-button:hover {
        background: var(--ink);
        color: white;
        transform: rotate(6deg);
      }

      @keyframes fade-in {
        from { opacity: 0; }
      }

      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
        }
      }

      @media (max-width: 520px) {
        .page-shell { padding: 22px; }
        .eyebrow { margin-bottom: 20px; }
        .download-button { margin-top: 38px; }
        .contact-dialog { padding: 16px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">Zakres prac</p>
        <h1 id="page-title">Tutaj znajduje się zakres prac do wykonania.</h1>
        <button class="download-button" id="open-dialog" type="button">
          <span aria-hidden="true">↓</span>
          Pobierz plik
        </button>
      </section>
    </main>

    <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-title">
      <div class="dialog-card">
        <button class="close-button" id="close-dialog" type="button" aria-label="Zamknij popup">×</button>
        <span class="spark" aria-hidden="true">✦</span>
        <h2 id="contact-title">Kontaktuj się</h2>
        <p>z Szymonem K.</p>
      </div>
    </dialog>

    <script>
      const dialog = document.querySelector("#contact-dialog");
      const openButton = document.querySelector("#open-dialog");
      const closeButton = document.querySelector("#close-dialog");

      openButton.addEventListener("click", () => dialog.showModal());
      closeButton.addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
    </script>
  </body>
</html>
